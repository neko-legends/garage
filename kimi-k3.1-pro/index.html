const scene = new THREE.Scene();

const M = {

const unitBox = new THREE.BoxGeometry(1,1,1);
function box(size,pos,mat=M.concrete,parent=scene,name=''){
  const o=new THREE.Mesh(unitBox,mat); o.scale.set(...size); o.position.set(...pos);
  o.castShadow=true;o.receiveShadow=true;o.name=name;parent.add(o);return o;
}
function cyl(r,depth,pos,mat,parent=scene,segments=20){
  const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,depth,segments),mat);
  o.position.set(...pos);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;
}
function quad(verts,mat,parent=scene){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts.flat(),3));
  g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function hull(sections,mat,parent){
  // Each section is [z, halfWidth, bottomY, topY], ordered front to rear.
  const v=[]; for(const [z,w,b,t] of sections)v.push([-w,b,z],[w,b,z],[w,t,z],[-w,t,z]);
  const idx=[];
  const face=(a,b,c,d)=>idx.push(a,b,c,a,c,d);
  face(0,3,2,1);
  for(let s=0;s<sections.length-1;s++){
    const a=s*4,b=(s+1)*4;
    face(a,b,b+3,a+3); face(a+1,a+2,b+2,b+1); face(a+3,b+3,b+2,a+2); face(a,a+1,b+1,b);
  }
  const n=(sections.length-1)*4;face(n,n+1,n+2,n+3);
  for(let i=0;i<idx.length;i+=3){const t=idx[i+1];idx[i+1]=idx[i+2];idx[i+2]=t;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}

// Screenshot cameras: reference-like front, three-quarter aerial, and orthographic plan.
let camera;
function makeCamera(){
  if(view==='top'){
    const aspect=innerWidth/innerHeight, h=12.8;
    camera=new THREE.OrthographicCamera(-h*aspect/2,h*aspect/2,h/2,-h/2,.1,80);
    camera.position.set(0,24,.001);camera.up.set(0,0,-1);camera.lookAt(0,0,0);
  }else{
    camera=new THREE.PerspectiveCamera(view==='iso'?36:36,innerWidth/innerHeight,.1,100);
    if(view==='iso')camera.position.set(13.8,16.8,15.5);else camera.position.set(12.8,10.8,15.8);
    camera.lookAt(0,1.0,-.25);
  }
}
makeCamera();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);makeCamera()});
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
window.__garage={scene,camera,view,renderer};
window.__sceneReady=true;
</script>
</body>
</html>
